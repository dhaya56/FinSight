[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
description = "Evidence-grounded company financial filing analyst powered by hybrid RAG."
requires-python = "==3.12.*"
dynamic = ["version"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "finsight.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these files and rewrites them on every autogenerate. Its
# emitted calls exceed the line limit, and hand-wrapping each new revision would
# be a recurring tax with no readability gain. Only the length rule is relaxed.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# boto3 and botocore ship no type information. Adding stub packages would mean
# another dependency for a boundary that is already isolated to one module, so
# the untyped import is accepted there and nowhere else.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests require live infrastructure and are excluded from the default
# run. Request them explicitly with: python -m pytest -m integration
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: requires live infrastructure such as PostgreSQL; excluded by default",
]

[tool.coverage.run]
source = ["src/finsight"]
branch = true

[tool.coverage.report]
show_missing = true
