# Streamlit presentation settings.
#
# Theme only. Nothing here is a secret and nothing here is application
# configuration: the API address and token come from the environment, because
# §28.12 keeps the UI's credentials out of files the repository tracks.
#
# Light and deliberately bright. The earlier dark palette read as a terminal, and
# this is a frontend a financial analyst and a general reader both have to want to
# look at. Colour carries meaning here rather than decoration — green for released,
# amber for partial, rose for withheld — so the palette is part of the information
# design and not a skin over it.

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fc"
textColor = "#0f172a"
font = "sans serif"

[server]
# Loopback only. The UI holds the API token server-side, so anything that can reach
# this port can search the corpus without a credential of its own.
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
