# FinSight corpus manifest
#
# What was acquired, from where, and which split it belongs to
# (PROJECT_BLUEPRINT.md §32.6). This file is committed; the documents it
# describes are not — see data/corpus/README.md.
#
# An entry is never edited once its checksum is recorded. A re-download whose
# bytes differ is a new candidate version (§32.7): add a new entry and set
# superseded_by on the old one.
#
# Some fields are deliberately absent rather than estimated. `period_end` and
# `published_at` may be omitted, and descriptive fields may read "unknown",
# where the value could not be established without either guessing or opening a
# frozen document. `corpus validate` prints every such gap, so an absent field
# stays distinguishable from an overlooked one. ENV-005 records why each is
# absent.

manifest_version = 1


