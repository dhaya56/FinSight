expected_challenges = "369 pages at 18.6 KB/page, produced by Adobe PDF Library. 106 pages (29%) display as landscape, and uniquely in this corpus they arrive two different ways: 28 have a natively wide MediaBox, while 78 are portrait pages carrying /Rotate 90. No page is upside down — no /Rotate 180 appears. The two sets are disjoint. This is the only document in the corpus that exercises the rotated coordinate path at all. Three page geometries including 1224x792 double-width spreads, likely to present as wide multi-column layouts that the positional reading-order rule will read across rather than down; measured at 48 pages (13%) where a column-aware ordering would differ. Every page yielded text on inspection, so no coverage gaps are predicted; any that appear are a defect. Consolidated and standalone statements both present (§16.9)."

