name: Integration

# Runs only the integration checks that already pass locally, against an official
# PostgreSQL service container. Kept separate from ci.yml, which runs unit and
# contract checks and needs no infrastructure.
#
# This job runs on Linux because GitHub service containers require a Linux
# runner. The command is identical to the one proven locally on Windows, but the
# runner operating system differs, so this workflow's own runs are its evidence.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same pinned tag as compose.yaml.
        image: postgres:18.6
        env:
          POSTGRES_DB: finsight
          POSTGRES_USER: finsight
          # Ephemeral value for a throwaway container that exists only for this
          # job and is never exposed. It is not a credential for any system, so
          # no repository secret is introduced. It is deliberately outside the
          # known-default deny-list that application settings reject.
          POSTGRES_PASSWORD: ephemeral-ci-value-not-a-real-credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Integration tests
        env:
          FINSIGHT_POSTGRES_HOST: 127.0.0.1
          FINSIGHT_POSTGRES_PORT: "5432"
          FINSIGHT_POSTGRES_DB: finsight
          FINSIGHT_POSTGRES_USER: finsight
          FINSIGHT_POSTGRES_PASSWORD: ephemeral-ci-value-not-a-real-credential
        run: python -m pytest -m integration
