# FinSight: infrastructure and application, single node.
#
# Services are added as their capability is implemented. Phase 2 introduced
# PostgreSQL; Phase 16a adds the API, the UI and the one-shot migrator.
#
# Values come from the repository-root .env, which is never committed. The
# ${VAR:?message} form makes `docker compose config` fail fast with a named
# variable rather than starting with a silent default.
#
# **Two variable namespaces, and the distinction is load-bearing.** FINSIGHT_* are
# application settings, read by pydantic-settings with extra="forbid". PUBLISH_* are
# host port mappings read only by Compose. They are kept apart because a FINSIGHT_*
# name that is *not* a settings field is accepted as an environment variable and
# **rejected** inside .env — measured: an unknown key in .env raises
# extra_forbidden and the application will not start. So a Compose-only variable
# named FINSIGHT_something is a crash waiting for someone to move it into .env.
#
# **Port allocation.** Everything binds 127.0.0.1, never 0.0.0.0, so nothing here is
# reachable from the local network. The application tier uses a reserved 87xx block
# chosen to stay clear of the 1xxxx range another project on this host publishes on,
# and of the defaults a developer is likely to want elsewhere (8000, 8080, 8501).
#
# **Ollama stays on the host** (§9.8, §10.4) and is reached through
# host.docker.internal. Verified on this host: Ollama listens on 127.0.0.1 only, and
# Docker Desktop still routes host.docker.internal to it — HTTP 200 from inside a
# container. extra_hosts declares the mapping explicitly so the same file works on
# Linux Docker, where it is not automatic.

name: finsight

# The API image, defined once and used by both the server and the migrator. One
# build, one artefact to scan and promote; the only difference is the command.
x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  image: finsight-api:local

# Connection settings shared by the server and the migrator. Service names, not
# loopback: inside the Compose network the database is "postgres".
x-api-environment: &api-environment
  FINSIGHT_ENV: ${FINSIGHT_ENV:-development}
  FINSIGHT_POSTGRES_HOST: postgres
  FINSIGHT_POSTGRES_PORT: 5432
  FINSIGHT_POSTGRES_DB: ${FINSIGHT_POSTGRES_DB:?set FINSIGHT_POSTGRES_DB in .env}
  FINSIGHT_POSTGRES_USER: ${FINSIGHT_POSTGRES_USER:?set FINSIGHT_POSTGRES_USER in .env}
  FINSIGHT_POSTGRES_PASSWORD: ${FINSIGHT_POSTGRES_PASSWORD:?set FINSIGHT_POSTGRES_PASSWORD in .env}

# Log rotation, applied to every service.
#
# Docker's json-file driver defaults to **no limit**, so a long-running stack writes
# until the disk fills — and the first symptom is usually something unrelated failing
# to write. uvicorn logs a line per request and PostgreSQL logs more than that, so
# "it is only a dev stack" is not a bound.
#
# 10 MiB x 3 files caps each service at 30 MiB and the stack at 180 MiB. Enough to
# diagnose a failure that happened minutes ago, which is what these logs are for;
# anything needing real retention needs a log shipper, and §9 keeps observability
# services disabled by default.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Hardening applied to every application container. The infrastructure services
# carry no-new-privileges already; these add to it rather than replace it.
x-hardened: &hardened
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    # Pinned by verified tag. The resolved digest is recorded in ENV-002 for
    # reproducibility; it is not pinned here because a digest is platform
    # specific and multi-platform compatibility has not been verified.
    image: postgres:18.6
    <<: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FINSIGHT_POSTGRES_DB:?set FINSIGHT_POSTGRES_DB in .env}
      POSTGRES_USER: ${FINSIGHT_POSTGRES_USER:?set FINSIGHT_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FINSIGHT_POSTGRES_PASSWORD:?set FINSIGHT_POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only: the database is not exposed to the local network.
      - "127.0.0.1:${FINSIGHT_POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/<major>/docker and
      # declares the volume at /var/lib/postgresql. Mounting the pre-18 path
      # (/var/lib/postgresql/data) would not persist data for this image.
      - finsight-postgres-data:/var/lib/postgresql
    networks:
      # Named explicitly. Once this file declares networks, a service that omits the
      # key joins "default" instead — and the API, which is on backbone, would then
      # be unable to resolve this one.
      - backbone
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # $$ prevents Compose substitution so the container shell expands these.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # §38.11, now set from measurement rather than deferred. The precondition this
    # file previously stated — "once the corpus is embedded and peak usage is
    # measured" — is satisfied: ENV-010 records 259 MiB peak during indexing and
    # 99.7 MiB under a sustained query workload.
    #
    # §38.11's purpose is specific: "Limits prevent parser or infrastructure
    # workloads from starving local models." That is not hypothetical here. A
    # corpus re-index failed with Ollama's server crash-looping at 0.8 GB of 15.7 GB
    # available, and Phase 8 adds llama3.1:8b (4.9 GB) to the same host. So these
    # limits exist to bound the containers, not to size them.
    #
    # 1 GiB is roughly 4x the measured peak. Generous on purpose: a limit should
    # contain a runaway, and a limit set close to a measured peak turns an ordinary
    # heavier workload into an OOM kill. Revisit when the corpus grows — three
    # filings is not a capacity plan.
    #
    # **No CPU limit.** Embedding and reranking are CPU-bound and contend with the
    # containers, so a limit is arguably warranted — but nothing has measured what
    # value would help, and a CPU cap on PostgreSQL during indexing could slow the
    # stage that is already the bottleneck. Left out rather than guessed.
    deploy:
      resources:
        limits:
          memory: 1g

  objectstore:
    # SeaweedFS speaks the S3 API; the application knows only S3 and treats this
    # as one endpoint among many. Pinned by tag; the resolved digest is recorded
    # in ENV-003.
    #
    # The image lives on Docker Hub. GHCR hosts a Helm chart under the same name,
    # not a container image, which is verified in ADR-001.
    image: chrislusf/seaweedfs:4.47
    <<: *logging
    restart: unless-stopped
    # "mini" is the all-in-one single-node mode: master, volume, filer and S3 in
    # one process. The admin UI is disabled because nothing here uses it.
    #
    # -s3.config is required, not optional: without an identities file SeaweedFS
    # accepts ANY access key and secret, which would remove credential
    # enforcement entirely. The file is generated locally and never committed.
    command: >
      mini
      -dir=/data
      -s3.config=/etc/seaweedfs/s3.json
      -admin.ui=false
    ports:
      # Loopback only, and only the S3 port. Master, filer, volume and admin
      # ports stay unpublished.
      - "127.0.0.1:8333:8333"
    volumes:
      - finsight-objectstore-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - backbone
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Verified against this image: /status returns 200 on the S3 port, while
      # / returns 403 because credentials are enforced.
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # The flattest of the three: 231 MiB peak during indexing against 142 MiB under a
    # query workload, because it serves immutable originals and does no query work.
    # 512 MiB is ~2.2x the peak — tighter than the others because the ceiling is
    # better understood, not because the service matters less.
    deploy:
      resources:
        limits:
          memory: 512m

  qdrant:
    # Pinned by tag; the resolved digest is recorded in ENV-009. The tag tracks
    # the pinned qdrant-client version, because the client and server negotiate
    # API shapes and a silent drift between them surfaces as a schema error on a
    # collection that worked yesterday.
    image: qdrant/qdrant:v1.19.1
    <<: *logging
    restart: unless-stopped
    ports:
      # Loopback only, and only the REST port. gRPC (6334) stays unpublished
      # because nothing uses it; the client speaks REST by default.
      # PUBLISH_, not FINSIGHT_: this is a host mapping, and the old
      # FINSIGHT_QDRANT_PORT name was a trap. It is not a settings field, so moving
      # it from the shell into .env — which .env.example invited — crashed the
      # application with extra_forbidden rather than changing a port.
      - "127.0.0.1:${PUBLISH_QDRANT_PORT:-6333}:6333"
    volumes:
      - finsight-qdrant-data:/qdrant/storage
    networks:
      - backbone
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image carries bash but no curl, wget or nc, so the check speaks HTTP
      # over bash's /dev/tcp. Verified against this image: /readyz returns 200.
      # A plain port-open check would report healthy while the collection layer
      # was still loading.
      #
      # CMD rather than CMD-SHELL, and bash named explicitly: CMD-SHELL runs
      # /bin/sh, which here is dash, and /dev/tcp is a bash feature. Under
      # CMD-SHELL this check fails with "cannot create /dev/tcp/..." on every
      # probe and the service never reports healthy.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n" >&3; head -1 <&3 | grep -q "200 OK"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # The highest of the three: 267 MiB peak during indexing, 222 MiB under a query
    # workload, against 14.6 MiB of raw dense vectors — so roughly 5x the vector data
    # goes on segments, payload indexes, the sparse index and allocator retention
    # (137.9 MiB retained against 81.1 MiB resident, ENV-010).
    #
    # 1 GiB is ~3.8x the peak, and the growth path is the reason for the headroom:
    # vectors stay in RAM. ENV-009 records disk-backing as available and not worth it
    # at 4,969 points; that trade changes as the corpus grows, and this limit is what
    # would make the change necessary rather than optional.
    deploy:
      resources:
        limits:
          memory: 1g

  # ------------------------------------------------------------------ application

  migrate:
    <<: [*api-image, *hardened, *logging]
    environment: *api-environment
    # Migrations are a deliberate step, never something the server does on start-up.
    # Two API containers coming up together would both run `alembic upgrade head`
    # against one database; Alembic's version table is not a lock, so the race is
    # resolved by whichever transaction commits first and the loser fails partway
    # through DDL. A one-shot service runs it exactly once, and the API waits for it
    # to exit zero.
    command: ["alembic", "upgrade", "head"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - backbone

  api:
    <<: [*api-image, *hardened, *logging]
    restart: unless-stopped
    environment:
      <<: *api-environment
      FINSIGHT_QDRANT_URL: http://qdrant:6333
      # The host, not a service. Ollama is deliberately not containerised.
      FINSIGHT_OLLAMA_BASE_URL: http://host.docker.internal:11434
      # §28.2 requires a token on every non-health route. Unset does not open the
      # API — the authenticated router returns 503 — so the failure mode is a closed
      # door, but a closed door is still an outage, hence the hard requirement here.
      FINSIGHT_API_TOKEN: ${FINSIGHT_API_TOKEN:?set FINSIGHT_API_TOKEN in .env}
      # No S3 variables. The API reaches object storage through no code path: there
      # is no upload route, and evidence text is read from PostgreSQL. Least
      # privilege is cheaper to keep than to add back.
      #
      # Cross-encoder thread count, overriding the image default. MEASURED in
      # ENV-014 rather than guessed: the image shipped 2, and reranking 25
      # candidates cost about 2,500 ms against ADR-006's host-native 1,700 ms at the
      # same depth — the cap, not the container, was the gap. Compose-only name, so
      # it cannot collide with the FINSIGHT_ settings namespace.
      OMP_NUM_THREADS: ${API_OMP_THREADS:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PUBLISH_API_PORT:-8701}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    tmpfs:
      # The root filesystem is read-only, so the few paths that must be writable are
      # named. /tmp is where torch and the tokenizer put scratch files; HOME exists
      # because libraries probe it and a missing one surfaces as an obscure failure
      # rather than a clear one. Both are size-capped: an unbounded tmpfs is host
      # memory a container can consume without a memory limit noticing.
      - /tmp:size=256m,mode=1777
    networks:
      - backbone
      - edge

    # MEASURED (ENV-014): 128 MiB at start-up, 493 MiB after five searches with the
    # cross-encoder resident. The jump is torch loading lazily — the model is not in
    # memory until the first reranked query, which is why an idle reading would have
    # understated the limit by a factor of four.
    #
    # 2 GiB is ~4.1x the measured peak, the same ratio PostgreSQL carries here, and
    # the headroom is deliberate: this container shares a 15.7 GB host with Ollama
    # serving an 8B model, on a host that has already lost an indexing run to memory
    # pressure (ADR-004). A limit set near a measured peak turns an ordinary heavier
    # query into an OOM kill.
    #
    # **No CPU limit**, consistent with the infrastructure services. The reranker's
    # thread count is bounded directly instead (OMP_NUM_THREADS above), which is the
    # control that actually matters: it caps contention with Ollama at the source
    # rather than throttling the container afterwards.
    deploy:
      resources:
        limits:
          memory: 2g

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    image: finsight-ui:local
    <<: [*hardened, *logging]
    restart: unless-stopped
    environment:
      # The whole configuration of this tier: where the API is, and the token to
      # call it with. No datastore address and no datastore credential.
      FINSIGHT_API_URL: http://api:8000
      FINSIGHT_API_TOKEN: ${FINSIGHT_API_TOKEN:?set FINSIGHT_API_TOKEN in .env}
      HOME: /tmp
    ports:
      - "127.0.0.1:${PUBLISH_UI_PORT:-8702}:8501"
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      # **edge only.** This is the control, not the configuration: the UI is not
      # attached to the backbone, so PostgreSQL, Qdrant and the object store are
      # neither resolvable nor routable from it. Withholding credentials is policy;
      # withholding the route is topology, and topology does not depend on anyone
      # remembering the policy.
      - edge

    # MEASURED (ENV-014): 55 MiB, flat across idle and five searches — the UI holds
    # no model and no connection pool, so its footprint is Streamlit's own.
    #
    # 512 MiB is ~9.3x that, looser than the ratio every other service here carries,
    # and deliberately so: the measurement is one browser session, and Streamlit keeps
    # per-session state, so the ceiling scales with concurrent viewers rather than
    # with the workload. That ceiling is unmeasured. Tightening this needs a
    # multi-session measurement, not a smaller number.
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  # Datastores and the services that are allowed to reach them.
  #
  # Not `internal: true`: that would disable published ports as well as egress, and
  # the CLI on the host connects to PostgreSQL and Qdrant through exactly those
  # ports. The separation that matters here is which containers share a network, and
  # the UI does not share this one.
  backbone:
    driver: bridge

  # The UI and the API. Nothing else.
  edge:
    driver: bridge

volumes:
  finsight-postgres-data:
  finsight-objectstore-data:
  finsight-qdrant-data:
